{% extends "layout.html" %}
{% block content %}
  <article class="bg-white rounded-lg shadow-lg p-8 max-w-lg mx-auto flex flex-col items-center border border-gray-200">
    <svg class="w-16 h-16 text-red-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12A9 9 0 1 1 3 12a9 9 0 0 1 18 0z"></path></svg>
    <h1 class="text-3xl font-bold text-red-600 mb-2">Oops... {{ status_code }} Error</h1>
    <p class="text-gray-700 mb-6">{{ message }}</p>
    <a href="/" class="inline-block px-6 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition">Go Home</a>
  </article>
{% endblock content %}
