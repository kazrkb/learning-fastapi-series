{% extends "layout.html" %}
{% block content %}
  <article class="content-section py-3 px-4 mb-4 bg-white rounded shadow">
    <div class="flex items-start gap-4">
      <img class="rounded-full flex-shrink-0"
           src="{{ url_for('static', path='profile_pics/default.jpg') }}"
           alt="{{ post.author }}'s profile picture"
           width="64"
           height="64"
           loading="lazy">
      <div class="flex-grow">
        <div class="article-metadata mb-2">
          <a class="mr-2 text-blue-600 hover:text-blue-800" href="#">{{ post.author }}</a>
          <small class="text-gray-500">{{ post.date_posted }}</small>
        </div>
        <h2 class="article-title text-2xl font-semibold text-gray-900">{{ post.title }}</h2>
        <p class="article-content text-gray-700 mt-2">{{ post.content }}</p>
        <!-- Only show edit/delete options if the user is the author -->
        <!-- TODO: Add user authentication and authorization -->
        <div class="post-actions mt-3 pt-3 border-t flex gap-2">
          <a class="px-4 py-2 border border-gray-400 rounded text-gray-700 hover:bg-gray-100 transition" href="#">Edit Post</a>
          <button type="button"
                  class="px-4 py-2 border border-red-400 rounded text-red-600 hover:bg-red-50 transition"
                  onclick="document.getElementById('deleteModal').classList.remove('hidden')">
            Delete Post
          </button>
        </div>
        <!-- TODO: Add user authentication and authorization -->
      </div>
    </div>
  </article>

  <!-- Delete Confirmation Modal (Tailwind) -->
  <div id="deleteModal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-40 z-50 hidden">
    <div class="bg-white rounded-lg shadow-lg w-full max-w-md">
      <div class="px-6 py-4 border-b flex justify-between items-center">
        <h5 class="text-lg font-semibold">Delete Post?</h5>
        <button type="button" class="text-gray-400 hover:text-gray-700 text-2xl font-bold" onclick="document.getElementById('deleteModal').classList.add('hidden')">&times;</button>
      </div>
      <form action="#">
        <div class="px-6 py-4">Are you sure you want to delete this post? This action cannot be undone.</div>
        <div class="px-6 py-3 border-t flex justify-end gap-2">
          <button type="button"
                  class="px-4 py-2 border border-gray-400 rounded text-gray-700 hover:bg-gray-100 transition"
                  onclick="document.getElementById('deleteModal').classList.add('hidden')">Cancel</button>
          <button type="submit" class="px-4 py-2 border border-red-400 rounded text-red-600 hover:bg-red-50 transition">Delete</button>
        </div>
      </form>
    </div>
  </div>
{% endblock content %}
